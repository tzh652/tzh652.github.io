<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHeal - Open Meal Plan</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fafafa;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 36px 24px;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            color: #F07F60;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #F07F60;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(240, 127, 96, 0.3);
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #d86d50;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Opening FoodieHeal...</h1>
        <p>Viewing shared meal plan. If the app does not open automatically, tap the button below.</p>
        <a id="open-btn" href="#" class="btn">Open in App</a>
    </div>

    <script>
        // Grab current search parameters (e.g., ?sourceStart=2026-08-02)
        const searchString = window.location.search;
        
        // Construct the exact App Link URL matching your manifest's host & path
        const appLinkUrl = "https://tzh652.github.io/share" + searchString;

        // Set the anchor tag href so manual taps trigger Android App Links
        const btn = document.getElementById('open-btn');
        btn.href = appLinkUrl;

        // Attempt automatic redirection on load
        window.location.replace(appLinkUrl);
    </script>
</body>
</html>
