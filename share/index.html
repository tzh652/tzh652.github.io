<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHeal - Open Shared Link</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fafafa;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 36px 24px;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            color: #F07F60;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #F07F60;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(240, 127, 96, 0.3);
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #d86d50;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="heading">Opening FoodieHeal...</h1>
        <p id="subtext">If the app does not open automatically, tap the button below.</p>
        <a id="open-btn" href="#" class="btn">Open in App</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sourceStart = urlParams.get('sourceStart');
        const templateId = urlParams.get('templateId');

        let targetHost = 'share';
        let queryParam = '';

        // Determine destination based on parameters present in URL
        if (templateId) {
            targetHost = 'template';
            queryParam = `templateId=${encodeURIComponent(templateId)}`;
            document.getElementById('heading').innerText = "Opening Shared Template...";
        } else if (sourceStart) {
            targetHost = 'share';
            queryParam = `sourceStart=${encodeURIComponent(sourceStart)}`;
            document.getElementById('heading').innerText = "Opening Shared Meal Plan...";
        }

        // 1. Target HTTPS App Link path
        const httpsUrl = queryParam 
            ? `https://tzh652.github.io/${targetHost}?${queryParam}`
            : `https://tzh652.github.io/${targetHost}`;

        // 2. Android Intent Scheme fallback (Chrome-friendly)
        const androidIntentUrl = queryParam
            ? `intent://${targetHost}?${queryParam}#Intent;scheme=foodieheal;package=com.example.foodieheal;end`
            : `intent://${targetHost}#Intent;scheme=foodieheal;package=com.example.foodieheal;end`;

        const openBtn = document.getElementById('open-btn');
        openBtn.href = androidIntentUrl;

        // Auto-redirect when landing on page
        window.onload = function() {
            window.location.href = androidIntentUrl;
        };
    </script>
</body>
</html>
